[package]
name = "nocry-core"
description = "nocry library: USB boot, fastboot client, images, GPT, sn_mac, restore/backup engines"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusb = "0.9"
crc32fast = "1"
getrandom = { version = "0.2", features = ["std"] }
libc = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
flate2 = "1"
# NebulaOS systems are zstd-compressed squashfs (pure Rust decoder)
ruzstd = "0.8"
# firmware parts mapped from files instead of held in memory (nocry on the board itself)
memmap2 = "0.9"
lzokay-native = { version = "0.2", default-features = false, features = ["decompress"] }
sevenz-rust2 = { version = "0.20", default-features = false, features = ["aes256"] }
md-5 = "0.10"
ureq = "2"
serde_json = "1"
# control over the LAN (nocry-rescue): pairing (SPAKE2 over P-256) and the encrypted link
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "std"] }
hmac = "0.12"
hkdf = "0.12"
chacha20poly1305 = "0.10"
# finding the board on the network (mDNS question on every interface)
if-addrs = "0.14"
socket2 = "0.6"

# no system libusb on Windows/macOS: build it in
[target.'cfg(not(target_os = "linux"))'.dependencies]
rusb = { version = "0.9", features = ["vendored"] }
