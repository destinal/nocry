<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" font-family="sans-serif">
  <rect width="520" height="300" fill="#ffffff"/>
  <rect x="60" y="30" width="400" height="230" rx="10" fill="#1f6f43" stroke="#124a2c" stroke-width="3"/>
  <text x="260" y="150" text-anchor="middle" font-size="18" fill="#cfe9da">K1 series mainboard (schematic, not to scale)</text>
  <!-- buttons, top left -->
  <rect x="84" y="52" width="26" height="26" rx="4" fill="#e9e9e9" stroke="#333"/><circle cx="97" cy="65" r="7" fill="#222"/>
  <rect x="84" y="92" width="26" height="26" rx="4" fill="#e9e9e9" stroke="#333"/><circle cx="97" cy="105" r="7" fill="#222"/>
  <text x="124" y="71" font-size="16" font-weight="bold" fill="#ffffff">BOOT ("mode")</text>
  <text x="124" y="111" font-size="16" font-weight="bold" fill="#ffffff">RESET</text>
  <!-- micro-USB, bottom edge -->
  <rect x="230" y="246" width="60" height="22" rx="3" fill="#c9c9c9" stroke="#333"/>
  <text x="260" y="290" text-anchor="middle" font-size="14" fill="#222">Micro-USB port (to the computer)</text>
