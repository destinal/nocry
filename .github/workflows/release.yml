# Builds the board images and the Linux, Windows and macOS packages.
# A tag "v*" also publishes them as a GitHub pre-release.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: "6.8.3"

jobs:
  images:
    name: Board images (SPL, U-Boot stages, recovery Linux, nocry-rescue)
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: dist-images
          key: images-${{ hashFiles('tools/burner-build/**', 'tools/recovery-build/**', 'tools/splhdr/**', 'tools/nocryboot-build/**', 'tools/rtos-build/**', 'rtos/**', 'host/**') }}
      - name: Build SPL and U-Boot stages
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/burner-build/build.sh "$PWD/out-burner"
      - name: Build nocryboot (first-stage loader for the eMMC)
        if: steps.cache.outputs.cache-hit != 'true'
        run: tools/nocryboot-build/build.sh "$PWD/out-nocryboot"
      - name: Build nocry-rtos (boot logo image)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil   # mkpictures.py reads the PNGs
          tools/rtos-build/build.sh "$PWD/out-rtos"
          VARIANT=k1 tools/rtos-build/build.sh "$PWD/out-rtos"
      - name: Build recovery Linux and nocry-rescue
        if: steps.cache.outputs.cache-hit != 'true'
        env:    # the rescue system carries the loader and boot logo images it can install
          BURNER_OUT: ${{ github.workspace }}/out-burner
          NOCRYBOOT_OUT: ${{ github.workspace }}/out-nocryboot
          RTOS_OUT: ${{ github.workspace }}/out-rtos
        run: RESCUE=1 tools/recovery-build/build.sh "$RUNNER_TEMP/recovery-work" "$PWD/out-recovery" || { tail -60 "$RUNNER_TEMP"/recovery-work/*.log; exit 1; }
      - name: Collect
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p dist-images/spl-x2000e
          cp out-burner/spl-x2000e/spl-x2000e.bin dist-images/spl-x2000e/
          for t in nocry_fb_x2000_v12 nocry_ums_x2000_v12 nocry_ums_ro_x2000_v12; do
            mkdir -p dist-images/$t && cp out-burner/$t/u-boot.bin dist-images/$t/
          done
          mkdir -p dist-images/nocryboot
          cp out-nocryboot/nocryboot-nebula.bin out-nocryboot/nocryboot-k1.bin dist-images/nocryboot/
          mkdir -p dist-images/nocry-rtos
          cp out-rtos/nocry-rtos.bin dist-images/nocry-rtos/nocry-rtos-nebula.bin
          cp out-rtos/nocry-rtos-k1.bin dist-images/nocry-rtos/
          cp out-recovery/nocry-recovery.uImage out-recovery/nocry-rescue.uImage dist-images/
          (cd dist-images && find . -type f | sort | xargs sha256sum | tee SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: images
          path: dist-images

  linux:
    name: Linux AppImage
    needs: images
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: images, path: images }
      - run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-wayland qt6-gtk-platformtheme libgl1-mesa-dev libusb-1.0-0-dev libudev-dev cmake ninja-build libfuse2 file
      - name: Build
        run: |
          (cd host && cargo build --release)
          cmake -S gui -B gui/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build gui/build
      - name: Package
        run: |
          V=${GITHUB_REF_NAME#v}; [[ "$GITHUB_REF" == refs/tags/* ]] || V=dev
          A=AppDir
          mkdir -p $A/usr/bin $A/usr/share/applications $A/usr/share/icons/hicolor/256x256/apps $A/usr/share/nocry
          cp gui/build/nocry-gui host/target/release/nocry $A/usr/bin/
          cp -r images $A/usr/bin/images
          cp gui/packaging/nocry.desktop $A/usr/share/applications/
          cp gui/packaging/nocry.png $A/usr/share/icons/hicolor/256x256/apps/
          cp host/contrib/60-nocry.rules LICENSE $A/usr/share/nocry/
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export EXTRA_PLATFORM_PLUGINS="libqoffscreen.so;libqwayland-generic.so;libqwayland-egl.so"
          export QMAKE=/usr/bin/qmake6 APPIMAGE_EXTRACT_AND_RUN=1 LDAI_OUTPUT=nocry-$V-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir $A --plugin qt --output appimage \
            --desktop-file $A/usr/share/applications/nocry.desktop --icon-file $A/usr/share/icons/hicolor/256x256/apps/nocry.png
          ls -l nocry-*.AppImage
      - name: Smoke test
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=offscreen timeout 60 ./nocry-*.AppImage --selftest "$PWD/shot.png" || true
          ls -l shot.png
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: "nocry-*.AppImage" }

  windows:
    name: Windows installer
    needs: images
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: images, path: images }
      - uses: jurplel/install-qt-action@v4
        with: { version: "${{ env.QT_VERSION }}", arch: win64_msvc2022_64, cache: true }
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: pwsh
        run: |
          cd host; cargo build --release; if ($LASTEXITCODE) { exit 1 }; cd ..
          cmake -S gui -B gui/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build gui/build; if ($LASTEXITCODE) { exit 1 }
      - name: Stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory stage | Out-Null
          Copy-Item gui/build/nocry-gui.exe, host/target/release/nocry.exe, LICENSE stage/
          Copy-Item -Recurse images stage/images
          Copy-Item -Recurse host/contrib/windows stage/driver
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw stage/nocry-gui.exe
          # app-local C++ runtime: no separate (administrator) redistributable install
          Get-ChildItem "$env:VCToolsRedistDir\x64\Microsoft.VC*.CRT\*.dll" | Copy-Item -Destination stage/
          Get-ChildItem stage | Select-Object Name, Length
      - name: Installer
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { 'dev' }
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress; $env:PATH += ';C:\Program Files (x86)\NSIS' }
          makensis /DVERSION=$v "/DSTAGE=$PWD\stage" "/DOUT=$PWD\nocry-$v-windows-x64-setup.exe" gui\packaging\installer.nsi
          if ($LASTEXITCODE) { exit 1 }
          # portable: the same files in a folder, nothing installed; unzip anywhere and run nocry-gui.exe
          Rename-Item stage "nocry-$v-windows-x64-portable"
          Compress-Archive -Path "nocry-$v-windows-x64-portable" -DestinationPath "nocry-$v-windows-x64-portable.zip" -CompressionLevel Optimal
          Get-ChildItem nocry-*-setup.exe, nocry-*-portable.zip | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            nocry-*-setup.exe
            nocry-*-portable.zip

  macos:
    name: macOS dmg (Apple silicon)
    needs: images
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: images, path: images }
      - uses: jurplel/install-qt-action@v4
        with: { version: "${{ env.QT_VERSION }}", cache: true }
      - name: Icon
        run: |
          I=nocry.iconset; mkdir $I
          for s in 16 32 128 256 512; do
            sips -z $s $s gui/packaging/nocry-1024.png --out $I/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) gui/packaging/nocry-1024.png --out $I/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns $I -o gui/packaging/nocry.icns
      - name: Build
        run: |
          (cd host && cargo build --release)
          cmake -S gui -B gui/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build gui/build
      - name: Bundle
        run: |
          APP=gui/build/nocry.app
          mkdir -p $APP/Contents/Resources
          cp -R images $APP/Contents/Resources/images
          cp host/target/release/nocry $APP/Contents/MacOS/nocry-cli
          macdeployqt $APP
          codesign --force --deep -s - $APP     # ad-hoc: no Apple developer certificate
          codesign --verify --deep $APP
      - name: Disk image
        run: |
          V=${GITHUB_REF_NAME#v}; [[ "$GITHUB_REF" == refs/tags/* ]] || V=dev
          brew install create-dmg
          mkdir dmgroot && cp -R gui/build/nocry.app dmgroot/
          for i in 1 2 3; do
            create-dmg --volname "nocry" --volicon gui/packaging/nocry.icns \
              --window-size 560 360 --icon-size 112 --icon "nocry.app" 150 170 \
              --app-drop-link 410 170 --hide-extension "nocry.app" --no-internet-enable \
              "nocry-$V-macos-arm64.dmg" dmgroot && break
            rm -f nocry-*.dmg; sleep 5
          done
          ls -l nocry-*.dmg
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: "nocry-*.dmg" }

  publish:
    name: Publish pre-release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [images, linux, windows, macos]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dl }
      - run: |
          mkdir out
          cp dl/linux/* dl/windows/* dl/macos/* out/
          (cd dl/images && tar czf ../../out/nocry-board-images-${GITHUB_REF_NAME#v}.tar.gz .)
          # the rescue image and the loaders as files of their own: what the rescue system's own
          # update check looks for (host/core/src/selfupdate.rs). GitHub lists size and SHA-256 of each.
          cp dl/images/nocry-rescue.uImage out/nocry-rescue-${GITHUB_REF_NAME#v}.uImage
          for f in nebula k1; do
            lv=$(strings dl/images/nocryboot/nocryboot-$f.bin | sed -n 's/^nocryboot-loader \([0-9.]*\) .*/\1/p' | head -1)
            [ -n "$lv" ] || { echo "no version in nocryboot-$f.bin" >&2; exit 1; }
            cp dl/images/nocryboot/nocryboot-$f.bin out/nocryboot-$f-$lv.bin
          done
          (cd out && sha256sum * > SHA256SUMS)
          ls -l out
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: out/*
          body: |
            **Beta.** Tested on Linux with a Creality Nebula Pad and a K1 mainboard (earlier versions also on macOS). On Windows the app runs, but talking to a board has **not been tested**: use "Set up driver…" in the window once (one administrator prompt; see "Windows driver" in the README).

            - Linux: `nocry-*-x86_64.AppImage` (make it executable; the window offers the one-time udev rule setup)
            - Windows: `nocry-*-windows-x64-setup.exe` (installs for the current user, no administrator rights), or `nocry-*-windows-x64-portable.zip` (unzip anywhere and run `nocry-gui.exe`; nothing is installed)
            - macOS (Apple silicon): `nocry-*-macos-arm64.dmg` (unsigned: right-click the app and choose Open the first time)
            - `nocry-board-images-*.tar.gz`: what nocry loads onto or installs on the board (SPL, U-Boot stages, recovery Linux, nocry-rescue, the nocryboot loader, the boot logo image), built from the sources and patches in this repository

            New in 0.2: **nocry-rescue**, a rescue system kept on the board itself (Nebula Pad family). Hold the screen while powering on and it starts, with no computer attached: a touch interface for Wi-Fi, firmware slots, installing firmware from the catalog, file system checks, resets, and the same functions as web pages for a phone or computer on the network. Store it with `nocry rescue --install` (needs the nocryboot loader 0.2, "Boot loader…" in the window). Also: NebulaOS in the firmware catalog; boards reached over Wi-Fi (found by mDNS) from the window and the command line; slot copies and erases run on the board itself; progress and Cancel for every long operation; more precise wording throughout.

            New in 0.2.0-beta.2: the rescue image is kept in the last 50 MiB of each firmware slot's partition (two copies, found by **nocryboot 0.4**), where firmware updates and factory resets do not reach it; USB flash drives in the rescue system (backup, restore, install, format); a web application in place of the plain pages; remote access switches (nocry over the network, ADB, SSH); Wi-Fi by WPS, with a fixed address, or as an access point with its own name and password; and the rescue image and nocryboot can update themselves from these releases (the files `nocry-rescue-*.uImage` and `nocryboot-*.bin` below are for that).

            **Coming from 0.2.0-beta.1:** that version kept the rescue image as a file on the data partition, for nocryboot 0.2. After updating nocry on the computer, run `nocry rescue --install` and then `nocry loader --install --yes` (in that order), so that the image and the loader that looks for it match.

            Take a backup before changing anything on a board.
